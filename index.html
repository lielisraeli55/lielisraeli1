<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בקרת גישה</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="access-body">
    <div class="container">
        <header>
            <h1>בקרת גישה</h1>
            <p class="subtitle">FACE RECOGNITION ACCESS CONTROL</p>
        </header>

        <div id="loading" class="loading-bar">
            <div class="loading-spinner"></div>
            <span id="loading-text">טוען מודלים...</span>
        </div>

        <!-- ENROLLMENT -->
        <section class="panel">
            <h2 class="panel-title">אנשים מורשים</h2>

            <div class="upload-row">
                <input type="text" id="person-name" placeholder="שם מלא" maxlength="40">
                <label for="file-input" class="file-label">
                    <span class="plus">+</span>
                    <span>בחר תמונה</span>
                </label>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>
            <p class="hint" id="enroll-hint">הכנס שם ולחץ לבחירת תמונה. התמונה תעובד ותישמר בדפדפן בלבד.</p>

            <div class="enrolled-list" id="enrolled-list">
                <p class="empty-msg">עדיין לא נוספו אנשים — כל פנים יזוהו כ"לא מורשה".</p>
            </div>
        </section>

        <!-- SCANNER -->
        <section class="panel">
            <h2 class="panel-title">סריקה חיה</h2>

            <div class="status-banner" id="status-banner" data-state="idle">
                <div class="status-pulse"></div>
                <div class="status-text" id="status-text">לחץ "הפעל סריקה"</div>
                <div class="status-sub" id="status-sub"></div>
            </div>

            <div class="video-container scan-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
                <div class="scanline"></div>
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="video-placeholder" id="video-placeholder">
                    <svg viewBox="0 0 100 100" width="80" height="80" aria-hidden="true">
                        <circle cx="50" cy="40" r="16" fill="none" stroke="currentColor" stroke-width="3"/>
                        <path d="M20,85 Q20,60 50,60 Q80,60 80,85" fill="none" stroke="currentColor" stroke-width="3"/>
                    </svg>
                    <p>המצלמה כבויה</p>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" class="btn btn-primary" disabled>הפעל סריקה</button>
                <button id="stop-btn" class="btn btn-secondary" disabled>עצור</button>
            </div>
        </section>

        <div id="error" class="error hidden"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
    <script src="script.js"></script>
</body>
</html>
