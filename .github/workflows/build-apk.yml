name: Build APK

on:
  push:
    branches: ['claude/hand-tracking-camera-iKo1K']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Stage web assets into www/
        run: |
          mkdir -p www/icons
          cp index.html style.css script.js manifest.webmanifest service-worker.js www/
          cp icons/*.png www/icons/
          cp .nojekyll www/ || true

      - name: Initialise Capacitor wrapper
        run: |
          cat > package.json <<'JSON'
          {
            "name": "airtouch",
            "version": "1.0.0",
            "private": true
          }
          JSON

          npm install --save @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.airtouch.app",
            "appName": "Air Touch",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true
            },
            "server": {
              "androidScheme": "https"
            }
          }
          JSON

          npx cap add android

      - name: Inject CAMERA permission and bump app metadata
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n</manifest>|' "$MANIFEST"
          echo "----- Patched AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/airtouch-${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/airtouch-latest.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: airtouch-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: dist/airtouch-${{ github.run_number }}.apk
          generate_release_notes: false
