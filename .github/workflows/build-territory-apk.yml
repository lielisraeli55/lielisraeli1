name: Build Territory APK

on:
  push:
    branches: ['claude/hand-tracking-camera-iKo1K']
    paths:
      - 'territory-game/**'
      - '.github/workflows/build-territory-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        working-directory: territory-game
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (generate native android/)
        working-directory: territory-game
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: territory-game/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp territory-game/android/app/build/outputs/apk/debug/app-debug.apk dist/territory-${{ github.run_number }}.apk
          ls -lh dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: territory-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: territory-${{ github.run_number }}
          name: שטחים APK ${{ github.run_number }}
          files: dist/territory-${{ github.run_number }}.apk
          generate_release_notes: false
          body: |
            APK של שטחים — משחק כיבוש שטחים מבוסס מיקום ואמת.

            **הגדרה ראשונה:**
            1. אישור הרשאת מיקום
            2. בחר שם וצבע
            3. צא לרחוב — תאים אפורים יופיעו על המפה
            4. עמוד 1.5 שניות בתא ולחץ "כבוש"
