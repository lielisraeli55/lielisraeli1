name: Build Territory APK

on:
  push:
    branches: ['claude/hand-tracking-camera-iKo1K']
    paths:
      - 'territory-game/**'
      - '.github/workflows/build-territory-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: territory-game/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install npm dependencies
        working-directory: territory-game
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Expo prebuild (generate native android/)
        working-directory: territory-game
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: 'true'
        run: |
          npx expo prebuild --platform android --no-install --clean

      - name: Inject Google Maps API key (if provided)
        if: ${{ env.GOOGLE_MAPS_KEY != '' }}
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        working-directory: territory-game
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i "s|YOUR_GOOGLE_MAPS_API_KEY_HERE|$GOOGLE_MAPS_KEY|g" android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Build debug APK
        working-directory: territory-game/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp territory-game/android/app/build/outputs/apk/debug/app-debug.apk dist/territory-${{ github.run_number }}.apk
          cp territory-game/android/app/build/outputs/apk/debug/app-debug.apk dist/territory-latest.apk
          ls -lh dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: territory-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: territory-${{ github.run_number }}
          name: Territory Conquest APK ${{ github.run_number }}
          files: dist/territory-${{ github.run_number }}.apk
          generate_release_notes: false
          body: |
            APK של Territory Conquest — משחק כיבוש שטחים מבוסס מיקום בעולם האמיתי.

            **התקנה ראשונה:**
            1. אישור הרשאת מיקום
            2. הזנת שם ובחירת צבע
            3. צא לרחוב — תאים אפורים יופיעו על המפה סביבך
            4. עמוד 1.5 שניות בתא ולחץ "כבוש את התא"

            **חשוב:** ללא מפתח Google Maps API, מצב המפה על אנדרואיד יוצג ריק / אפור.
            כדי להפעיל את המפה במלואה צריך לקבוע את ה-secret `GOOGLE_MAPS_KEY` במאגר
            (Settings → Secrets and variables → Actions → New repository secret),
            ואז להריץ workflow_dispatch כדי לבנות מחדש.
